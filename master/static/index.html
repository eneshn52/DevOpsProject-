<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Master Agent - Gereksinim Gönder</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    input[type=text], textarea { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; }
    textarea { height: 220px; }
    button { padding: 10px 20px; font-size: 15px; cursor: pointer; }
    #result { margin-top: 20px; padding: 12px; border-radius: 6px; display: none; }
    .ok { background: #e6f4ea; } .err { background: #fce8e6; }
  </style>
</head>
<body>
  <h1>Gereksinim Dökümanı Gönder</h1>
  <label>Proje adı</label>
  <input type="text" id="name" placeholder="Örn: Kütüphane Yönetim Sistemi">

  <label>Gereksinimleri yapıştırın</label>
  <textarea id="text"></textarea>

  <label>veya dosya yükleyin (.txt, .md, .pdf)</label><br>
  <input type="file" id="file" accept=".txt,.md,.pdf"><br><br>

  <button onclick="submitProject()">Gönder</button>
  <div id="result"></div>

  <script>
    async function submitProject() {
      const fd = new FormData();
      fd.append("name", document.getElementById("name").value);
      fd.append("text", document.getElementById("text").value);
      const f = document.getElementById("file").files[0];
      if (f) fd.append("file", f);

      const res = await fetch("/api/projects", { method: "POST", body: fd });
      const data = await res.json();
      const box = document.getElementById("result");
      box.style.display = "block";
      if (res.ok) {
        box.className = "ok";
        box.textContent = `Proje #${data.id} oluşturuldu (${data.characters} karakter).`;
      } else {
        box.className = "err";
        box.textContent = data.detail || "Bir hata oluştu.";
      }
    }
  </script>
</body>
</html>
