name: devopsproject-

services:
  web:
    build: .
    image: devops-workspace:local
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run docker/start.ps1 to create .env.docker first}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      USE_SQLITE: "False"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-devops_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      OLLAMA_DEFAULT_URL: ${OLLAMA_DEFAULT_URL:-http://host.docker.internal:11434}
      OLLAMA_LOOPBACK_HOST: ${OLLAMA_LOOPBACK_HOST:-host.docker.internal}
      OLLAMA_REQUEST_TIMEOUT: ${OLLAMA_REQUEST_TIMEOUT:-180}
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5).read()"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 45s
    stop_grace_period: 250s
  db:
    image: postgres:16-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-devops_postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-devops_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_BIND_ADDRESS:-0.0.0.0}:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-devopsproject-_postgres_data}
